[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "zipf-villes"
version = "0.1.0"
description = "Loi de Zipf sur les populations de villes : estimation, comparaison à la log-normale, simulation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "scipy>=1.10",
]

[dependency-groups]
dev = [
    "ipykernel",
    "matplotlib>=3.7",
    "nbconvert",
    "powerlaw",
    "pytest",
    "ruff",
    "statsmodels>=0.14",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
